<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIZA COLLECTION - Sacs à main</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f0;
      color: #44372b;
      text-align: center;
    }

    header {
      background: #44372b;
      color: white;
      padding: 35px 15px;
    }

    header h1 {
      color: #e6c78b;
      font-size: 32px;
    }

    .collection {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 30px 15px;
    }

    .sac {
      background: white;
      width: 230px;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000015;
    }

    .sac img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      border-radius: 10px;
    }

    .sac h3 {
      color: #8b6b3f;
    }

    .prix {
      font-size: 20px;
      font-weight: bold;
    }

    footer {
      background: #44372b;
      color: white;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>DIZA COLLECTION</h1>
  <h2>Collection de sacs à main</h2>
  <p>L'élégance et le luxe dans chaque détail</p>
</header>

<h2 style="color:#8b6b3f; margin-top:35px;">
  NOS SACS À MAIN
</h2>

<div class="collection">

  <div class="sac">
    <img src="diza-sac-a-main.png" alt="Sac à main classique">
    <h3>Sac à main classique</h3>
    <p class="prix">1 500 €</p>
  </div>

  <div class="sac">
    <img src="diza-sac-a-main-2.png" alt="Sac à main chic">
    <h3>Sac à main chic</h3>
    <p class="prix">1 500 €</p>
  </div>

</div>

<footer>
  <h3>DIZA COLLECTION</h3>
  <p>Merci de votre visite ❤️</p>
</footer>

</body>
</html>
